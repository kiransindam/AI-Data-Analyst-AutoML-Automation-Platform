name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================
  # JOB 1: Lint
  # =============================================
  lint:
    name: 🔍 Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff==0.4.8

      - name: Run Ruff
        run: ruff check backend/ --output-format=github
        continue-on-error: true

  # =============================================
  # JOB 2: Backend Tests (FIXED)
  # =============================================
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev gcc g++

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        working-directory: ./backend
        env:
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: sk-fake-key-for-ci-testing-only
          DEBUG: "true"
        run: |
          python -m pytest ../tests/ -v --tb=long -x 2>&1 | head -100

  # =============================================
  # JOB 3: Docker Build
  # =============================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: automl-backend:test
